name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Marketing router structure
        run: python3 scripts/check-marketing-structure.py
      - name: Skill frontmatter and links
        run: python3 scripts/check-skills.py
      - name: Index sync
        run: python3 scripts/check-indexes.py
      - name: Agent yaml
        run: python3 scripts/check-agent-yaml.py
      - name: References
        run: python3 scripts/check-references.py
      - name: Assets
        run: python3 scripts/check-assets.py
      - name: Provenance
        run: python3 scripts/check-provenance.py
      - name: YAML lint
        run: pipx run yamllint -c .yamllint.yaml skills/*/agents .github
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@v19

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pytest
        run: python3 -m pip install -r tests/requirements.txt
      - name: Checker tests
        run: python3 -m pytest -q tests

  site:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked site dependencies
        run: npm ci
      - name: Build documentation
        run: npm exec -- vp run site:build
      - name: Check documentation
        run: npm exec -- vp run site:check
      - name: Lint site code
        run: npm exec -- vp run site:lint
      - name: Install browser
        run: npm exec -- playwright install --with-deps chromium
      - name: Browser acceptance tests
        run: npm exec -- vp run site:test
      - name: Configure Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/.vitepress/dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, tests, site]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
