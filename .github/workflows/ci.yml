name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Marketing router structure
        run: python3 scripts/check-marketing-structure.py
      - name: Skill frontmatter and links
        run: python3 scripts/check-skills.py
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@v19
